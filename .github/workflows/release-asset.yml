name: Release Asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach HACS zip
    # Gitea Actions also auto-detects .github/workflows — skip there, GitHub-only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build zip
        run: |
          cd custom_components/gaggiuino_profiler
          zip -r "$GITHUB_WORKSPACE/gaggiuino_profiler.zip" . -x '*__pycache__*'

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" gaggiuino_profiler.zip --clobber
