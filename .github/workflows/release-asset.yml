name: Release Asset

# Releases are immutable (#409): once published, no asset can be added. The release
# tooling therefore creates each stable release as a draft, dispatches this workflow
# with the tag, waits for it, and publishes the draft only after the zip is attached.
# Beta pre-releases attach their own zip in dev-prerelease.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to attach the HACS zip to (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  zip:
    name: Attach HACS zip
    # Gitea Actions also auto-detects .github/workflows — skip there, GitHub-only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload (drafts are only visible with write access)
    steps:
      - name: Check tag and draft state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a stable release tag: $TAG"; exit 1; }
          draft="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          [[ "$draft" == "true" ]] || { echo "::error::Release $TAG is not a draft; a published release accepts no new assets"; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Verify release tag signature
        env:
          TAG: ${{ inputs.tag }}
          ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
        run: |
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          printf '%s\n' "$ALLOWED_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" verify-tag "$TAG"

      - name: Build zip
        run: |
          cd custom_components/gaggiuino_profiler
          zip -r "$GITHUB_WORKSPACE/gaggiuino_profiler.zip" . -x '*__pycache__*'

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" gaggiuino_profiler.zip --clobber
