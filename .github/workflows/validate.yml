name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: HACS validation
        uses: Wandalen/wretry.action@e94c43bf2e865e7dbbd90b0c1061053f5888932a # master
        with:
          action: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
          attempt_limit: 3
          attempt_delay: 2000
          with: |
            category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -q --cov=custom_components/gaggiuino_profiler --cov-report=term-missing --cov-fail-under=88

  card-sync:
    name: Bundled cards match upstream releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare bundled card versions against latest upstream release
        run: |
          set -euo pipefail
          check() {
            local repo="$1" const_name="$2" bundled_file="$3"
            local latest bundled
            latest=$(curl -fsSL "https://api.github.com/repos/mxkissnr/${repo}/releases/latest" | jq -r '.tag_name' | sed 's/^v//')
            bundled=$(grep -oP "const ${const_name} = '\K[^']+" "${bundled_file}")
            echo "${repo}: latest release v${latest}, bundled ${bundled}"
            if [ "${latest}" != "${bundled}" ]; then
              echo "::error file=${bundled_file}::${repo} latest release is v${latest} but the bundled copy is v${bundled} — run scripts/sync-to-integration.sh in that repo and re-copy here"
              exit 1
            fi
          }
          check "glp-lovelace-card" "GLP_CARD_VERSION" "custom_components/gaggiuino_profiler/www/glp-card.js"
          check "glp-order-card" "GLP_ORDER_CARD_VERSION" "custom_components/gaggiuino_profiler/www/glp-order-card.js"
