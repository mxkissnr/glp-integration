name: Validate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: HACS validation
        uses: Wandalen/wretry.action@e94c43bf2e865e7dbbd90b0c1061053f5888932a # master
        with:
          action: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
          attempt_limit: 3
          attempt_delay: 2000
          with: |
            category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -q --cov=custom_components/gaggiuino_profiler --cov-report=term-missing --cov-fail-under=88

  cards:
    name: Cards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cards
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: cards/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        # apt-get (triggered by --with-deps) has hung indefinitely before when
        # the runner's regional Ubuntu mirror was unreachable -- a short
        # per-attempt timeout + retry lets a single mirror hiccup self-heal
        # within this run instead of needing a manual rerun. apt gets its own
        # retries and a short HTTP timeout, and a failed attempt stops the
        # apt-get it leaves behind: `timeout` only ends npx, the root apt-get
        # survives and holds the dpkg lock, so every retry failed (#305).
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt $attempt/3 failed or timed out, retrying..."
            sudo pkill -x apt-get || true
            while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 2; done
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::Playwright Chromium install failed after 3 attempts"
          exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:coverage

      - name: Build and check the committed bundles
        # The two bundles under custom_components/gaggiuino_profiler/www/ are
        # generated from cards/ and committed; a bundle that no longer matches
        # its source fails here.
        run: |
          npm run build
          git diff --exit-code -- ../custom_components/gaggiuino_profiler/www/ || { echo "::error::The card bundles in custom_components/gaggiuino_profiler/www/ are out of date, run npm run build in cards/ and commit them"; exit 1; }
