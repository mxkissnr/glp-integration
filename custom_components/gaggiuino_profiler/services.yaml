backup:
  fields:
    machine:
      required: false
      example: 2
      selector:
        number:
          min: 1
          mode: box

maintenance_done:
  fields:
    task:
      required: true
      example: descaling
      selector:
        text:
    machine:
      required: false
      example: 2
      selector:
        number:
          min: 1
          mode: box

set_ready_by:
  fields:
    target_time:
      required: false
      example: "2026-07-28 07:30:00"
      selector:
        datetime:
    machine:
      required: false
      example: 2
      selector:
        number:
          min: 1
          mode: box
